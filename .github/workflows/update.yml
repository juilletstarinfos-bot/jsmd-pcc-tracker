name: 更新標案資料並發佈網站
on:
  schedule:
    - cron: "0 0,6,10 * * *"   # 台灣時間 08:00、14:00、18:00
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 抓取並分類
        if: github.event_name != 'push'
        run: python fetch.py --days 3 --max-detail 150
        timeout-minutes: 15
        env:
          OPENFUN_TOKEN: ${{ secrets.OPENFUN_TOKEN }}
      # 之後的 LINE 幫手：在這裡加一步，把新命中的標案推播到 LINE
      - name: 存回資料
        if: github.event_name != 'push'
        run: |
          git config user.name "pcc-bot"; git config user.email "pcc-bot@users.noreply.github.com"
          git add data/tenders.json
          git diff --cached --quiet || git commit -m "更新標案資料 $(date -u +%F)"
          git push
      - name: 準備網站檔案
        run: mkdir -p _site/data && cp index.html _site/ && cp data/tenders.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
